<div class="confirm-modal-overlay hidden" data-dojo-attach-point="overlayNode">
  <div class="confirm-modal-box" role="alertdialog" aria-modal="true" tabindex="-1"
       aria-labelledby="${id}_title" aria-describedby="${id}_message" data-dojo-attach-point="dialogNode">
    <div class="confirm-modal-header confirm-modal-section">
      <p id="${id}_title" data-dojo-attach-point="titleNode">${i18n.general.confirm}</p>
      <button type="button" class="confirm-modal-close" aria-label="${i18n.general.cancel}" data-dojo-attach-point="closeButton" data-dojo-attach-event="onclick:_onCancel">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" aria-hidden="true" focusable="false">
          <path d="M376.6 84.5c11.3-13.6 9.5-33.8-4.1-45.1s-33.8-9.5-45.1 4.1L192 206 56.6 43.5C45.3 29.9 25.1 28.1 11.5 39.4S-3.9 70.9 7.4 84.5L150.3 256 7.4 427.5c-11.3 13.6-9.5 33.8 4.1 45.1s33.8 9.5 45.1-4.1L192 306 327.4 468.5c11.3 13.6 31.5 15.4 45.1 4.1s15.4-31.5 4.1-45.1L233.7 256 376.6 84.5z"/>
        </svg>
      </button>
    </div>
    <div class="confirm-modal-body confirm-modal-section">
      <p id="${id}_message" data-dojo-attach-point="messageNode"></p>
    </div>
    <div class="confirm-modal-footer confirm-modal-section">
      <button type="button" class="confirm-modal-button confirm-modal-secondary" data-dojo-attach-point="cancelButton" data-dojo-attach-event="onclick:_onCancel">${i18n.general.cancel}</button>
      <button type="button" class="confirm-modal-button confirm-modal-primary" data-dojo-attach-point="confirmButton" data-dojo-attach-event="onclick:_onConfirm">${i18n.general.del}</button>
    </div>
  </div>

  <style>
    .confirm-modal-overlay {
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.2);
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .confirm-modal-overlay.hidden {
      display: none;
    }

    .confirm-modal-box {
      width: 500px;
      max-width: 90%;
      min-height: 200px;
      background-color: white;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    .confirm-modal-section {
      padding: 10px;
    }

    .confirm-modal-header {
      flex: 0 0 50px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
    }

    .confirm-modal-header > p {
      margin: 0;
      padding: 0;
    }

    .confirm-modal-body {
      flex: 1 1 auto;
      word-break: break-word;
    }

    .confirm-modal-footer {
      flex: 0 0 50px;
      display: flex;
      justify-content: flex-end;
    }

    .confirm-modal-button {
      border: none;
      padding: 5px;
      margin-left: 10px;
      min-width: 100px;
      border-radius: 5px;
      cursor: pointer;
    }

    .confirm-modal-secondary {
      background-color: transparent;
      border: 1px solid rgb(0, 102, 255);
      color: rgb(0, 102, 255);
    }

    .confirm-modal-primary {
      background-color: rgb(240, 27, 27);
      color: white;
    }

    .confirm-modal-close {
      width: 25px;
      height: 25px;
      padding: 5px;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .confirm-modal-close svg {
      width: 100%;
      height: 100%;
    }
  </style>
</div>
